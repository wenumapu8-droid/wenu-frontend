<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#050608">
  <title>KDX Perspective Flip</title>
  <link rel="stylesheet" href="./kodex-flip.css">
</head>
<body>
  <main
    class="kdx-flip"
    data-kdx-flip
    data-state="0"
  >
    <canvas
      class="kdx-flip__canvas"
      aria-hidden="true"
    ></canvas>

    <div
      class="kdx-fallback"
      aria-hidden="true"
    ></div>

    <div class="kdx-shell">
      <header class="kdx-header">
        <div class="kdx-logo">
          KODEX−∞
        </div>

        <div class="kdx-header__right">
          <span class="kdx-dot"></span>
          <span>PROJECTION · UNSTABLE</span>
          <span>KDX_07</span>
        </div>
      </header>

      <section class="kdx-main">
        <div class="kdx-copy">
          <p class="kdx-kicker">
            07 / 08 · PROJECTION REVERSAL PROTOCOL
          </p>

          <h1 class="kdx-title">
            THE WORLD TURNS WITHOUT ROTATING.
          </h1>

          <p class="kdx-description">
            Move horizontally to interpolate between
            two incompatible projections. Tap to force
            a complete reversal.
          </p>

          <div class="kdx-actions">
            <button
              class="kdx-cta"
              type="button"
              data-kdx-activate
            >
              FLIP THE FRAME →
            </button>

            <button
              class="kdx-mic"
              type="button"
              data-kdx-mic
              aria-label="Activate microphone response"
              aria-pressed="false"
            >
              MIC
            </button>
          </div>
        </div>

        <div aria-hidden="true"></div>

        <aside class="kdx-rail">
          <div>
            State
            <strong data-kdx-state>
              DORMANT
            </strong>
          </div>

          <div>
            Phase
            <strong data-kdx-phase>
              PROJECTION A
            </strong>
          </div>

          <div>
            Geometry
            <strong>
              DUAL
            </strong>
          </div>

          <div>
            FPS
            <strong data-kdx-fps>
              —
            </strong>
          </div>
        </aside>
      </section>

      <footer class="kdx-footer">
        <span>PREVIOUS</span>

        <span
          class="kdx-progress"
          aria-hidden="true"
        ></span>

        <span class="kdx-footer__index">
          07 / 08 · INDEX
        </span>
      </footer>
    </div>
  </main>

  <script
    type="module"
    src="./kodex-flip.js"
  ></script>
</body>
</html>
