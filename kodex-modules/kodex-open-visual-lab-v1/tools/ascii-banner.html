<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KODEX ASCII Banner</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:20px;background:#050608;color:#e9ede8;font-family:monospace}
    main{max-width:1200px;margin:auto}h1{font:900 clamp(42px,8vw,100px)/.8 Arial Narrow,Impact,sans-serif;margin:20px 0}
    .controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
    input,button{min-height:44px;border:1px solid #343b42;background:#0a0d10;color:#e9ede8;padding:0 12px;font:inherit}
    button{cursor:pointer;border-color:#ff1744}pre{overflow:auto;min-height:360px;padding:20px;border:1px solid #343b42;background:#030405;color:#ff334f;font-size:clamp(8px,1vw,14px);line-height:1}
    a{color:#ff334f}@media(max-width:700px){.controls{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <a href="../index.html">← VISUAL LAB</a>
    <h1>ASCII BANNER</h1>
    <div class="controls">
      <input id="text" value="KODEX-∞" aria-label="Banner text">
      <input id="on" value="##" aria-label="On pixels">
      <button id="copy">COPY</button>
    </div>
    <pre id="output"></pre>
  </main>
  <script type="module">
    import { renderBanner } from "../src/ascii/banner.mjs";
    const text = document.querySelector("#text");
    const on = document.querySelector("#on");
    const output = document.querySelector("#output");
    const render = () => {
      output.textContent = renderBanner(text.value, {
        on: on.value || "##",
        off: " ".repeat((on.value || "##").length),
      });
    };
    text.addEventListener("input", render);
    on.addEventListener("input", render);
    document.querySelector("#copy").addEventListener("click", async () => {
      await navigator.clipboard.writeText(output.textContent);
    });
    render();
  </script>
</body>
</html>
