<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <title>KODEX Open Visual Lab</title>
  <link rel="stylesheet" href="./demo/styles.css">
</head>
<body>
  <main class="app">
    <canvas id="kdx-canvas" aria-label="KODEX generative visual"></canvas>

    <div class="scanline" aria-hidden="true"></div>
    <div class="frame" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <strong>KODEX−∞</strong>
        <span>OPEN VISUAL LAB / V1</span>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        <span id="status">INITIALIZING</span>
      </div>
    </header>

    <aside class="rail rail-left" aria-label="Scene metadata">
      <span>NODE 00</span>
      <span>STATE AWARE</span>
      <span>SOURCE ORIGINAL</span>
    </aside>

    <section class="hero-copy">
      <p>VISUAL SYSTEM / ORIGINAL CODE</p>
      <h1>THE ARCHIVE<br>DOES NOT STORE.<br>IT REMEMBERS.</h1>
      <span>
        Liquid acid · CRT · feedback · ASCII · audio signal
      </span>
    </section>

    <section class="control-panel">
      <div class="control-panel__header">
        <strong>GPU PARAMETERS</strong>
        <button id="clear" type="button">CLEAR MEMORY</button>
      </div>

      <label>
        <span>SCENE</span>
        <select id="scene">
          <option value="liquid">LIQUID ACID</option>
          <option value="archive">ARCHIVE ORBIT</option>
          <option value="threshold">THRESHOLD PORTAL</option>
          <option value="mandelbrot">MANDELBROT FIELD</option>
          <option value="bloom">SIGNAL BLOOM</option>
        </select>
      </label>

      <div class="toggle-row">
        <label><input id="crt" type="checkbox" checked> CRT</label>
        <label><input id="ascii" type="checkbox"> ASCII</label>
        <label><input id="dither" type="checkbox" checked> DITHER</label>
      </div>

      <label>
        <span>FEEDBACK <output id="feedback-value"></output></span>
        <input id="feedback" type="range" min="0" max=".92" step=".01" value=".16">
      </label>

      <label>
        <span>INTENSITY <output id="intensity-value"></output></span>
        <input id="intensity" type="range" min=".4" max="1.8" step=".01" value="1">
      </label>

      <label>
        <span>ASCII CELL <output id="ascii-cell-value"></output></span>
        <input id="ascii-cell" type="range" min="6" max="30" step="1" value="12">
      </label>

      <label>
        <span>GRAIN <output id="grain-value"></output></span>
        <input id="grain" type="range" min="0" max=".16" step=".005" value=".035">
      </label>

      <label>
        <span>RGB SPLIT <output id="rgb-split-value"></output></span>
        <input id="rgb-split" type="range" min="0" max="6" step=".1" value="1.2">
      </label>

      <label>
        <span>SPEED <output id="speed-value"></output></span>
        <input id="speed" type="range" min=".1" max="2.5" step=".05" value="1">
      </label>

      <label>
        <span>QUALITY</span>
        <select id="quality">
          <option value=".75">LOW POWER</option>
          <option value="1">MOBILE</option>
          <option value="1.5" selected>STANDARD</option>
          <option value="2">HIGH</option>
        </select>
      </label>

      <button id="microphone" type="button">ENABLE MIC</button>
      <button id="screenshot" type="button">EXPORT PNG</button>

      <div class="audio-meter">
        <span>LOW</span><i><b id="audio-low"></b></i>
        <span>MID</span><i><b id="audio-mid"></b></i>
        <span>HIGH</span><i><b id="audio-high"></b></i>
      </div>
    </section>

    <nav class="bottom-nav">
      <a href="./tools/ascii-banner.html">ASCII BANNER</a>
      <a href="./tools/image-to-ascii.html">IMAGE → ASCII</a>
      <a href="./resources/FREE_OPEN_RESOURCES.md">RESOURCE MATRIX</a>
    </nav>

    <pre id="error-panel" class="error-panel" hidden></pre>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
