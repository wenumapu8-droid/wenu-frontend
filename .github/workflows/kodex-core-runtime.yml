name: KODEX Core Runtime

on:
  pull_request:
    paths:
      - 'src/lib/kodex/**'
      - 'src/kodex/return/**'
      - 'src/components/kodex/KodexRecuerda.astro'
      - 'src/pages/kodex/**'
      - 'public/kodex/assets/**'
      - 'scripts/kodex-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/kodex-core-runtime.yml'
  push:
    branches:
      - 'feat/kodex-scene-registry-runtime-v1'
    paths:
      - 'src/lib/kodex/**'
      - 'src/kodex/return/**'
      - 'src/components/kodex/KodexRecuerda.astro'
      - 'src/pages/kodex/**'
      - 'public/kodex/assets/**'
      - 'scripts/kodex-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/kodex-core-runtime.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: KODEX runtime tests
        run: npm run test:kodex:core
      - name: KODEX integrity audit
        run: npm run audit:kodex:integrity
      - name: Astro build
        env:
          ALLOW_EMPTY_PRODUCTS: 'true'
        run: npm run build
      - name: Install Chromium for KODEX evidence
        run: npx playwright install --with-deps chromium
      - name: Start Astro preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/kodex-preview.log 2>&1 &
          echo $! > /tmp/kodex-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/kodex/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/kodex-preview.log
          exit 1
      - name: Capture KODEX browser evidence
        env:
          KODEX_PREVIEW_URL: 'http://127.0.0.1:4321'
        run: node scripts/kodex-browser-evidence.mjs
      - name: Upload KODEX browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodex-browser-evidence
          path: artifacts/kodex-browser-evidence
          if-no-files-found: warn
          retention-days: 14
