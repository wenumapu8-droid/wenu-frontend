name: KODEX Core Runtime

on:
  pull_request:
    paths:
      - 'src/lib/kodex/**'
      - 'src/kodex/return/**'
      - 'src/components/kodex/KodexRecuerda.astro'
      - 'src/pages/kodex/**'
      - 'public/kodex/assets/**'
      - 'scripts/kodex-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/kodex-core-runtime.yml'
  push:
    branches:
      - 'feat/kodex-scene-registry-runtime-v1'
    paths:
      - 'src/lib/kodex/**'
      - 'src/kodex/return/**'
      - 'src/components/kodex/KodexRecuerda.astro'
      - 'src/pages/kodex/**'
      - 'public/kodex/assets/**'
      - 'scripts/kodex-*.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/kodex-core-runtime.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: KODEX runtime tests
        run: npm run test:kodex:core
      - name: KODEX integrity audit
        run: npm run audit:kodex:integrity
      - name: Astro build
        env:
          ALLOW_EMPTY_PRODUCTS: 'true'
        run: npm run build
