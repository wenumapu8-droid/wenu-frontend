name: KODEX Runtime CI

on:
  push:
    branches:
      - "feature/kodex-organism-engine-foundation"
      - "feature/kodex-m1-vertical-slice"
      - "feature/kodex-temple-system-v0"
    paths:
      - "src/kodex/organism-engine/**"
      - "src/kodex/experience/**"
      - "src/kodex/temple/**"
      - "src/components/kodex/organism/**"
      - "src/components/kodex/experience/**"
      - "src/components/kodex/temple/**"
      - "src/pages/kodex/lab/organism-engine.astro"
      - "src/pages/kodex/lab/vertical-slice.astro"
      - "src/pages/kodex/lab/signal-temple.astro"
      - "src/kodex/threshold-portal/**"
      - "public/img/kodex/organisms/**"
      - "docs/kodex/ORGANISM_ENGINE_USAGE.md"
      - "docs/kodex/M1_VERTICAL_SLICE_RUNTIME.md"
      - "docs/kodex/KODEX_TEMPLE_SYSTEM_V0.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/kodex-organism-engine-ci.yml"
  pull_request:
    paths:
      - "src/kodex/organism-engine/**"
      - "src/kodex/experience/**"
      - "src/kodex/temple/**"
      - "src/components/kodex/organism/**"
      - "src/components/kodex/experience/**"
      - "src/components/kodex/temple/**"
      - "src/pages/kodex/lab/organism-engine.astro"
      - "src/pages/kodex/lab/vertical-slice.astro"
      - "src/pages/kodex/lab/signal-temple.astro"
      - "src/kodex/threshold-portal/**"
      - "public/img/kodex/organisms/**"
      - "docs/kodex/ORGANISM_ENGINE_USAGE.md"
      - "docs/kodex/M1_VERTICAL_SLICE_RUNTIME.md"
      - "docs/kodex/KODEX_TEMPLE_SYSTEM_V0.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/kodex-organism-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALLOW_EMPTY_PRODUCTS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro project
        run: npm run build

      - name: Verify internal lab outputs
        run: |
          test -f dist/kodex/lab/organism-engine/index.html
          grep -q "UNIVERSAL ORGANISM ENGINE" dist/kodex/lab/organism-engine/index.html
          test -f dist/kodex/lab/vertical-slice/index.html
          grep -q "VERTICAL SLICE" dist/kodex/lab/vertical-slice/index.html
          test -f dist/kodex/lab/signal-temple/index.html
          grep -q "SIGNAL TEMPLE" dist/kodex/lab/signal-temple/index.html
