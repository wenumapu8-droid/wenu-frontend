name: KODEX Organism Engine CI

on:
  push:
    branches:
      - "feature/kodex-organism-engine-foundation"
    paths:
      - "src/kodex/organism-engine/**"
      - "src/components/kodex/organism/**"
      - "src/pages/kodex/lab/organism-engine.astro"
      - "src/kodex/threshold-portal/**"
      - "public/img/kodex/organisms/**"
      - "docs/kodex/ORGANISM_ENGINE_USAGE.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/kodex-organism-engine-ci.yml"
  pull_request:
    paths:
      - "src/kodex/organism-engine/**"
      - "src/components/kodex/organism/**"
      - "src/pages/kodex/lab/organism-engine.astro"
      - "src/kodex/threshold-portal/**"
      - "public/img/kodex/organisms/**"
      - "docs/kodex/ORGANISM_ENGINE_USAGE.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/kodex-organism-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro project
        run: npm run build

      - name: Verify organism lab output
        run: |
          test -f dist/kodex/lab/organism-engine/index.html
          grep -q "UNIVERSAL ORGANISM ENGINE" dist/kodex/lab/organism-engine/index.html
