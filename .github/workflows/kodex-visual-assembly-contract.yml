name: KODEX Visual Assembly Contract

on:
  pull_request:
    paths:
      - 'docs/kodex/visual-assembly/**'
      - 'scripts/verify-kodex-visual-assembly.mjs'
      - '.github/workflows/kodex-visual-assembly-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kodex-visual-assembly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-visual-assembly-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Verify Visual Assembly governance contract
        run: node scripts/verify-kodex-visual-assembly.mjs
