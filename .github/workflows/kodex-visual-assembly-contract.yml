name: KODEX Visual Assembly Contract

on:
  pull_request:
    paths:
      - 'docs/kodex/visual-assembly/**'
      - 'scripts/verify-kodex-visual-assembly.mjs'
      - 'scripts/verify-kodex-hero-media.mjs'
      - 'scripts/verify-kodex-assembly-candidate.mjs'
      - 'scripts/kodex-visual-assembly-query.mjs'
      - '.github/workflows/kodex-visual-assembly-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kodex-visual-assembly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-visual-assembly-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Verify Visual Assembly governance contract
        run: node scripts/verify-kodex-visual-assembly.mjs

      - name: Verify hero-media provenance gate
        run: node scripts/verify-kodex-hero-media.mjs

      - name: Verify strict Assembly Candidate contract
        run: node scripts/verify-kodex-assembly-candidate.mjs

      - name: Smoke-test agent query interface
        run: |
          node scripts/kodex-visual-assembly-query.mjs summary > /tmp/kdx-summary.json
          node scripts/kodex-visual-assembly-query.mjs scene ARCHIVE > /tmp/kdx-archive.json
          node scripts/kodex-visual-assembly-query.mjs brief THRESHOLD > /tmp/kdx-threshold-brief.json
          node scripts/kodex-visual-assembly-query.mjs component KDX-VIS-0041 > /tmp/kdx-component.json
          node scripts/kodex-visual-assembly-query.mjs recipe RCP-MONOLITH > /tmp/kdx-recipe.json
          grep -q '"componentCount": 77' /tmp/kdx-summary.json
          grep -q '"visual_mode": "03_ARCHIVE"' /tmp/kdx-archive.json
          grep -q '"schema": "kdx.visual-agent-brief.v0.1"' /tmp/kdx-threshold-brief.json
          grep -q '"topology_authority": false' /tmp/kdx-threshold-brief.json
          grep -q '"slug": "MRK_crosshair"' /tmp/kdx-component.json
          grep -q '"id": "RCP-MONOLITH"' /tmp/kdx-recipe.json
