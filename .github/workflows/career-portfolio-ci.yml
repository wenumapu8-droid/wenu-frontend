name: OCIN Portfolio CI

on:
  push:
    branches:
      - career/ocin-portfolio-2026-10-04
  pull_request:
    branches:
      - redesign-v2
    paths:
      - 'src/pages/portfolio/**'
      - 'src/styles/portfolio.css'
      - '.github/workflows/career-portfolio-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALLOW_EMPTY_PRODUCTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.1'
          cache: npm
      - run: npm ci
      - run: npm run build
