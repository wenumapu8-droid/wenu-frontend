name: KODEX Product Corridor Slice

on:
  pull_request:
    paths:
      - 'src/pages/kodex/**'
      - 'src/components/kodex/**'
      - 'src/kodex/threshold-portal/**'
      - 'src/kodex/return/**'
      - 'src/kodex/crt/**'
      - 'src/scripts/kodex-engine.js'
      - 'src/styles/kodex*.css'
      - 'scripts/kodex-threshold-product-evidence.mjs'
      - 'scripts/kodex-prologue-product-evidence.mjs'
      - 'scripts/kodex-descent-product-evidence.mjs'
      - 'scripts/kodex-archive-product-evidence.mjs'
      - 'scripts/kodex-machine-product-evidence.mjs'
      - 'scripts/kodex-cosmology-product-evidence.mjs'
      - 'scripts/kodex-return-product-evidence.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/kodex-threshold-product.yml'

jobs:
  product-corridor-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI intentionally has no WooCommerce credentials. This is the existing
      # repo build escape hatch for KODEX-only validation; it does not change
      # production catalog behavior or authorize an empty production deploy.
      ALLOW_EMPTY_PRODUCTS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start Astro preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/kodex-product-preview.log 2>&1 &
          echo $! > /tmp/kodex-product-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4321/kodex/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kodex-product-preview.log
          exit 1
      - name: Validate THRESHOLD desktop / mobile / reduced-motion
        env:
          KODEX_PREVIEW_URL: http://127.0.0.1:4321
        run: npm run test:kodex:threshold
      - name: Validate PROLOGUE desktop / mobile / reduced-motion
        env:
          KODEX_PREVIEW_URL: http://127.0.0.1:4321
        run: npm run test:kodex:prologue
      - name: Validate DESCENT desktop / mobile / reduced-motion
        env:
          KODEX_PREVIEW_URL: http://127.0.0.1:4321
        run: npm run test:kodex:descent
      - name: Validate ARCHIVE desktop / mobile / reduced-motion
        env:
          KODEX_PREVIEW_URL: http://127.0.0.1:4321
        run: node scripts/kodex-archive-product-evidence.mjs
      - name: Validate ARCHIVE→MACHINE interlude / MACHINE desktop / mobile / reduced-motion
        env:
          KODEX_PREVIEW_URL: http://127.0.0.1:4321
        run: node scripts/kodex-machine-product-evidence.mjs
      - name: Validate COSMOLOGY desktop / mobile / touch / keyboard / reduced-motion
        env:
          KODEX_PREVIEW_URL: http://127.0.0.1:4321
        run: node scripts/kodex-cosmology-product-evidence.mjs
      - name: Validate COSMOLOGY→RETURN interlude / RETURN memory specimen / desktop / mobile / reduced-motion
        env:
          KODEX_PREVIEW_URL: http://127.0.0.1:4321
        run: node scripts/kodex-return-product-evidence.mjs
      - name: Upload product corridor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodex-product-corridor-evidence
          path: |
            artifacts/kodex-threshold-evidence
            artifacts/kodex-prologue-evidence
            artifacts/kodex-descent-evidence
            artifacts/kodex-archive-evidence
            artifacts/kodex-machine-evidence
            artifacts/kodex-cosmology-evidence
            artifacts/kodex-return-evidence
          if-no-files-found: warn
          retention-days: 14
