name: Ocín Collage Browser QA

on:
  pull_request:
    paths:
      - 'src/pages/kodex/lab/ocin-collage/**'
      - 'src/components/kodex/ocin/OcinArtworkTile.astro'
      - 'src/components/kodex/ocin/OcinCollageShell.astro'
      - 'src/lib/kodex/ocin/collage-pages-v1.ts'
      - 'src/styles/kodex-ocin-collage.css'
      - 'public/assets/kodex/ocin/originals/**'
      - '.github/workflows/ocin-collage-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocin-collage-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ALLOW_EMPTY_PRODUCTS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Astro application
        run: npm run build

      - name: Verify collage outputs and vendored originals
        run: |
          test -f dist/kodex/lab/ocin-collage/index.html
          test -f dist/kodex/lab/ocin-collage/archive/index.html
          test -f dist/kodex/lab/ocin-collage/museum/index.html
          grep -q 'noindex, nofollow' dist/kodex/lab/ocin-collage/index.html
          grep -q 'THRESHOLD' dist/kodex/lab/ocin-collage/index.html
          grep -q 'ARCHIVE ATLAS' dist/kodex/lab/ocin-collage/archive/index.html
          grep -q 'MUSEUM OF SPACE' dist/kodex/lab/ocin-collage/museum/index.html
          test -f dist/assets/kodex/ocin/originals/OCN-TOR-005.jpg
          test -f dist/assets/kodex/ocin/originals/OCN-TOR-001.jpg
          test -f dist/assets/kodex/ocin/originals/OCN-SQR-001.jpg
          test -f dist/assets/kodex/ocin/originals/OCN-FRC-002.jpg
          test -f dist/assets/kodex/ocin/originals/OCN-TRI-001.jpg
          test -f dist/assets/kodex/ocin/originals/OCN-MND-GRY-002.jpg

      - name: Start preview server
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/ocin-collage-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4321/kodex/lab/ocin-collage/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ocin-collage-preview.log
          exit 1

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Verify visual integrity and capture evidence
        run: |
          mkdir -p qa-artifacts
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const base = 'http://127.0.0.1:4321';
          const routes = [
            ['threshold', '/kodex/lab/ocin-collage/'],
            ['archive', '/kodex/lab/ocin-collage/archive/'],
            ['museum', '/kodex/lab/ocin-collage/museum/'],
          ];
          const expectedAssets = [
            'OCN-TOR-005',
            'OCN-TOR-001',
            'OCN-SQR-001',
            'OCN-FRC-002',
            'OCN-TRI-001',
            'OCN-MND-GRY-002',
          ];

          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };

          const verifyPage = async (page, name) => {
            await page.waitForLoadState('networkidle');
            const overflow = await page.evaluate(() => document.documentElement.scrollWidth - window.innerWidth);
            assert(overflow <= 1, `${name}: horizontal overflow ${overflow}px`);

            const images = page.locator('[data-ocin-art] img');
            const count = await images.count();
            assert(count > 0, `${name}: no original artwork images rendered`);

            for (let i = 0; i < count; i += 1) {
              const result = await images.nth(i).evaluate((img) => {
                const style = getComputedStyle(img);
                return {
                  complete: img.complete,
                  naturalWidth: img.naturalWidth,
                  naturalHeight: img.naturalHeight,
                  objectFit: style.objectFit,
                  filter: style.filter,
                  transform: style.transform,
                  mixBlendMode: style.mixBlendMode,
                  clipPath: style.clipPath,
                };
              });
              assert(result.complete && result.naturalWidth > 0 && result.naturalHeight > 0, `${name}: broken artwork image ${i}`);
              assert(result.objectFit === 'contain', `${name}: artwork ${i} object-fit=${result.objectFit}`);
              assert(result.filter === 'none', `${name}: artwork ${i} filter=${result.filter}`);
              assert(result.transform === 'none', `${name}: artwork ${i} transform=${result.transform}`);
              assert(result.mixBlendMode === 'normal', `${name}: artwork ${i} mix-blend-mode=${result.mixBlendMode}`);
              assert(result.clipPath === 'none', `${name}: artwork ${i} clip-path=${result.clipPath}`);
            }

            const ids = await page.locator('[data-ocin-art]').evaluateAll((nodes) => nodes.map((node) => node.getAttribute('data-ocin-art')));
            assert(ids.every(Boolean), `${name}: artwork without provenance ID`);
            return { overflow, imageCount: count, ids };
          };

          const browser = await chromium.launch({ headless: true });
          const report = {};

          // Desktop evidence for all three surfaces.
          for (const [name, route] of routes) {
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
            const page = await context.newPage();
            await page.goto(`${base}${route}`);
            report[`${name}-desktop`] = await verifyPage(page, `${name}-desktop`);
            await page.screenshot({ path: `qa-artifacts/${name}-1440x1000.png`, fullPage: true });
            await context.close();
          }

          // Mobile touch evidence.
          {
            const context = await browser.newContext({ viewport: { width: 390, height: 844 }, hasTouch: true, isMobile: true });
            const page = await context.newPage();
            await page.goto(`${base}/kodex/lab/ocin-collage/`);
            report['threshold-390x844'] = await verifyPage(page, 'threshold-390x844');
            await page.screenshot({ path: 'qa-artifacts/threshold-390x844.png', fullPage: true });
            await context.close();
          }

          // Reduced-motion + second mobile width.
          {
            const context = await browser.newContext({ viewport: { width: 412, height: 915 }, hasTouch: true, isMobile: true, reducedMotion: 'reduce' });
            const page = await context.newPage();
            await page.goto(`${base}/kodex/lab/ocin-collage/museum/`);
            report['museum-412x915-reduced'] = await verifyPage(page, 'museum-412x915-reduced');
            const transitionDuration = await page.locator('.ocx__cta').evaluate((el) => getComputedStyle(el).transitionDuration);
            assert(transitionDuration === '0.001ms' || transitionDuration === '0s', `reduced motion transition still active: ${transitionDuration}`);
            await page.screenshot({ path: 'qa-artifacts/museum-412x915-reduced.png', fullPage: true });
            await context.close();
          }

          const union = new Set(Object.values(report).flatMap((entry) => entry.ids));
          for (const id of expectedAssets) assert(union.has(id), `expected asset missing from evidence: ${id}`);

          await browser.close();
          fs.writeFileSync('qa-artifacts/browser-acceptance.json', JSON.stringify({ status: 'PASS', report }, null, 2));
          NODE

      - name: Upload Ocín collage QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocin-collage-browser-qa
          path: qa-artifacts/
          if-no-files-found: warn
