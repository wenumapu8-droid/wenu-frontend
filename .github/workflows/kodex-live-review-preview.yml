name: KODEX Live Review Preview Build

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.*'
      - 'KODEX-LIVE-REVIEW-SNAPSHOT.md'
      - '.github/workflows/kodex-live-review-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout preview snapshot
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build full verified static output
        run: ALLOW_EMPTY_PRODUCTS=true npm run build

      - name: Verify noindex staging guard
        shell: bash
        run: |
          test -f dist/_headers
          grep -F 'X-Robots-Tag: noindex, nofollow, noarchive' dist/_headers
          test -f dist/kodex/index.html

      - name: Upload deploy-ready preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: kodex-live-review-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
