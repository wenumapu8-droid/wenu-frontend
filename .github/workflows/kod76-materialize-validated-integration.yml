name: KODEX KOD-76 Materialize Validated Integration

on:
  push:
    branches:
      - wenumapu8/kod-76-machine-causal-assembly-proof-01

permissions:
  contents: write

jobs:
  materialize:
    if: "${{ !contains(github.event.head_commit.message, 'KOD-76: materialize validated MACHINE integration') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALLOW_EMPTY_PRODUCTS: 'true'
    steps:
      - name: Checkout branch head
        uses: actions/checkout@v4
        with:
          ref: wenumapu8/kod-76-machine-causal-assembly-proof-01
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Re-verify deterministic topology contract
        run: node scripts/kodex-machine-topology-contract.mjs

      - name: Apply exact guarded integration
        run: node scripts/apply-kod76-machine-integration.mjs

      - name: Enforce bounded product patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'src/pages/kodex/folio/[folio].astro'
          grep -q "buildMachineTopology" 'src/pages/kodex/folio/[folio].astro'
          grep -q "ASSEMBLY/TRACE/CELL" 'src/pages/kodex/folio/[folio].astro'
          grep -q "kodex-machine-assembly.css" 'src/pages/kodex/folio/[folio].astro'

      - name: Build exact patched product
        run: npm run build

      - name: Commit only validated product integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'wenumapu8-droid'
          git config user.email 'wenu.mapu8@gmail.com'
          git add -- 'src/pages/kodex/folio/[folio].astro'
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = '1'
          test "$(git diff --cached --name-only)" = 'src/pages/kodex/folio/[folio].astro'
          git commit -m 'KOD-76: materialize validated MACHINE integration'
          git push origin HEAD:wenumapu8/kod-76-machine-causal-assembly-proof-01
