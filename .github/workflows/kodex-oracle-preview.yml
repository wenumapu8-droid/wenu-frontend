name: KODEX Oracle Presence Preview

# Isolated creator-review deployment for PR #121.
# NEVER deploys production or the shared kodex-preview alias.
# The proof route itself is noindex/nofollow.

on:
  push:
    branches:
      - 'codex/oracle-presence-v0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      - name: Build
        env:
          ALLOW_EMPTY_PRODUCTS: 'true'
        run: npm run build

      - name: Deploy isolated Oracle preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages deploy dist \
            --project-name=wenu-frontend \
            --branch=oracle-presence-v0 \
            --commit-dirty=true
