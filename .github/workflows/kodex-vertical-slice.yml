name: KODEX Vertical Slice

on:
  pull_request:
    paths:
      - 'src/pages/kodex/**'
      - 'src/components/kodex/**'
      - 'src/lib/kodex/**'
      - 'src/styles/kodex*.css'
      - 'src/kodex/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/kodex-vertical-slice.yml'
  push:
    branches:
      - feature/kodex-vertical-slice-v0
    paths:
      - 'src/pages/kodex/**'
      - 'src/components/kodex/**'
      - 'src/lib/kodex/**'
      - 'src/styles/kodex*.css'
      - 'src/kodex/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/kodex-vertical-slice.yml'

permissions:
  contents: read

concurrency:
  group: kodex-vertical-slice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ALLOW_EMPTY_PRODUCTS: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Build Astro application
        run: npm run build
