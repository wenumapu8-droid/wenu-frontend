<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">DNA Ascent static fallback</title>
  <desc id="desc">Two luminous strands rise around a vertical axis, connected by repeated signal rungs.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#120d1d"/>
      <stop offset="0.52" stop-color="#06070c"/>
      <stop offset="1" stop-color="#020203"/>
    </radialGradient>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f0ff"/>
      <stop offset="0.35" stop-color="#8a6cff"/>
      <stop offset="1" stop-color="#22d7ff"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ff4fd8"/>
      <stop offset="1" stop-color="#7e5cff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-20%" width="180%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#bg)"/>
  <g opacity=".28" stroke="#9c8cff" stroke-width="1">
    <path d="M450 70V1130"/>
    <path d="M120 600H780"/>
    <circle cx="450" cy="600" r="310" fill="none"/>
    <circle cx="450" cy="600" r="210" fill="none"/>
  </g>
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M330 110 C610 180 610 260 330 330 S50 480 330 550 S610 700 330 770 S50 920 330 990 S610 1120 450 1160" stroke="url(#a)" stroke-width="8"/>
    <path d="M570 110 C290 180 290 260 570 330 S850 480 570 550 S290 700 570 770 S850 920 570 990 S290 1120 450 1160" stroke="url(#b)" stroke-width="8"/>
  </g>
  <g stroke="#d9d2ff" stroke-opacity=".5" stroke-width="2">
    <path d="M345 150L555 150"/><path d="M300 235L600 235"/><path d="M355 320L545 320"/>
    <path d="M585 405L315 405"/><path d="M605 490L295 490"/><path d="M540 575L360 575"/>
    <path d="M320 660L580 660"/><path d="M295 745L605 745"/><path d="M365 830L535 830"/>
    <path d="M575 915L325 915"/><path d="M600 1000L300 1000"/><path d="M520 1085L380 1085"/>
  </g>
  <g fill="#f6f3ff">
    <circle cx="450" cy="86" r="5"/><circle cx="450" cy="1115" r="4"/>
  </g>
  <text x="36" y="48" fill="#d9d2ff" font-family="monospace" font-size="18" letter-spacing="4">KODEX−∞ // DNA ASCENT // STATIC</text>
</svg>
