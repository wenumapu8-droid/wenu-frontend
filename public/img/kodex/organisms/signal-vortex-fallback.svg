<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title description">
  <title id="title">KODEX Signal Vortex</title>
  <desc id="description">A static radial spiral field converging toward a luminous center.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#35105f"/>
      <stop offset="0.35" stop-color="#130525"/>
      <stop offset="1" stop-color="#020204"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.18" stop-color="#c7a8ff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#7134c9" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7134c9" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <g fill="none" stroke="#8651d8" stroke-width="2" stroke-opacity="0.48" filter="url(#glow)">
    <path d="M600 600C790 420 1040 520 1030 730C1020 940 720 1080 430 960C140 840 80 490 300 250C520 10 930 70 1120 350"/>
    <path d="M600 600C720 455 935 500 955 665C975 830 760 975 520 920C280 865 175 610 300 390C425 170 745 135 960 275"/>
    <path d="M600 600C655 490 830 485 875 610C920 735 790 870 620 865C450 860 325 715 365 545C405 375 610 295 785 365"/>
    <path d="M600 600C605 530 710 505 760 580C810 655 745 765 645 785C545 805 450 725 455 625C460 525 555 455 650 470"/>
    <path d="M600 600C565 570 585 510 635 505C685 500 725 555 705 605C685 655 625 680 585 645"/>
  </g>
  <g fill="none" stroke="#38a9bd" stroke-width="1.5" stroke-opacity="0.3">
    <circle cx="600" cy="600" r="115"/>
    <circle cx="600" cy="600" r="245"/>
    <circle cx="600" cy="600" r="390"/>
    <circle cx="600" cy="600" r="520"/>
  </g>
  <circle cx="600" cy="600" r="145" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="600" cy="600" r="13" fill="#fff"/>
</svg>
