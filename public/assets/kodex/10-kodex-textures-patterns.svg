<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1220" role="img" aria-labelledby="title desc" style="color:#E6E6E6;background:transparent">
<title id="title">KODEX textures and patterns</title><desc id="desc">Original modular vector asset for the KODEX visual system.</desc>

<style>
  :root { --kdx-off:#E6E6E6; --kdx-lime:#A6FF00; --kdx-cyan:#00F0FF; --kdx-violet:#8A5CFF; --kdx-magenta:#FF00C8; --kdx-orange:#FF6A00; --kdx-red:#FF3038; }
  .kdx-main { color: #E6E6E6; }
  .kdx-lime { color: #A6FF00; }
  .kdx-cyan { color: #00F0FF; }
  .kdx-violet { color: #8A5CFF; }
  .kdx-magenta { color: #FF00C8; }
  .kdx-orange { color: #FF6A00; }
  .kdx-red { color: #FF3038; }
  .fill-current { fill: currentColor; }
  .stroke-current { fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; }
  .hairline { vector-effect: non-scaling-stroke; }
</style>

<defs>
<pattern id="grid-small" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="currentColor" stroke-opacity=".24" stroke-width="1"/></pattern>
<pattern id="grid-large" width="96" height="96" patternUnits="userSpaceOnUse"><rect width="96" height="96" fill="url(#grid-small)"/><path d="M96 0H0V96" fill="none" stroke="currentColor" stroke-opacity=".38" stroke-width="1.5"/></pattern>
<pattern id="scanlines" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="2" fill="currentColor" fill-opacity=".14"/></pattern>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.7" fill="currentColor" fill-opacity=".34"/></pattern>
<pattern id="dither" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="2" height="2" fill="currentColor"/><rect x="4" y="4" width="2" height="2" fill="currentColor"/></pattern>
<pattern id="circuit" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M0 20H34V0M80 60H46V80M20 80V46H0M60 0V34H80" fill="none" stroke="currentColor" stroke-opacity=".4"/><circle cx="34" cy="20" r="3" fill="currentColor"/><circle cx="46" cy="60" r="3" fill="currentColor"/></pattern>
<filter id="noise" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" seed="18" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .22"/></feComponentTransfer></filter>
</defs>

<g id="texture-grid" class="kdx-main"><rect x="60" y="60" width="650" height="380" fill="url(#grid-large)"/></g>
<g id="texture-scanlines" class="kdx-cyan"><rect x="850" y="60" width="650" height="380" fill="url(#scanlines)"/></g>
<g id="texture-dots" class="kdx-lime"><rect x="60" y="530" width="420" height="350" fill="url(#dots)"/></g>
<g id="texture-dither" class="kdx-violet"><rect x="590" y="530" width="420" height="350" fill="url(#dither)"/></g>
<g id="texture-circuit" class="kdx-orange"><rect x="1120" y="530" width="380" height="350" fill="url(#circuit)"/></g>
<g id="texture-noise" class="kdx-main"><rect x="60" y="930" width="1440" height="220" fill="currentColor" filter="url(#noise)"/></g>

</svg>