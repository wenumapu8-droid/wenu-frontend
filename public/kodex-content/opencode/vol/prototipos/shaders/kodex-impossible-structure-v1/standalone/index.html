<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050608">
  <title>KDX Impossible Structure</title>
  <link rel="stylesheet" href="./kodex-impossible.css">
</head>
<body>
  <main class="kdx-impossible" data-kdx-impossible data-state="0">
    <canvas class="kdx-impossible__canvas" aria-hidden="true"></canvas>
    <div class="kdx-fallback" aria-hidden="true"></div>

    <div class="kdx-shell">
      <header class="kdx-header">
        <div class="kdx-logo">KODEX−∞</div>
        <div class="kdx-header__right">
          <span class="kdx-dot"></span>
          <span>STRUCTURE · LIVE</span>
          <span>KDX_02</span>
        </div>
      </header>

      <section class="kdx-main">
        <div class="kdx-copy">
          <p class="kdx-kicker">02 / 08 · NON-EUCLIDEAN PROTOCOL</p>
          <h1 class="kdx-title">THE STRUCTURE REMEMBERS TWO DIRECTIONS.</h1>
          <p class="kdx-description">
            An impossible architecture generated in real time. Move through it:
            the same body turns toward incompatible horizons.
          </p>

          <div class="kdx-actions">
            <button class="kdx-cta" type="button" data-kdx-activate>
              ENTER CONTRADICTION →
            </button>
            <button
              class="kdx-mic"
              type="button"
              data-kdx-mic
              aria-label="Activate microphone response"
              aria-pressed="false"
            >
              MIC
            </button>
          </div>
        </div>

        <div aria-hidden="true"></div>

        <aside class="kdx-rail">
          <div>State<strong data-kdx-state>DORMANT</strong></div>
          <div>Class<strong>IMPOSSIBLE</strong></div>
          <div>Axis<strong>DUAL</strong></div>
          <div>FPS<strong data-kdx-fps>—</strong></div>
        </aside>
      </section>

      <footer class="kdx-footer">
        <span>PREVIOUS</span>
        <span class="kdx-progress" aria-hidden="true"></span>
        <span class="kdx-footer__index">02 / 08 · INDEX</span>
      </footer>
    </div>
  </main>

  <script type="module" src="./kodex-impossible.js"></script>
</body>
</html>
