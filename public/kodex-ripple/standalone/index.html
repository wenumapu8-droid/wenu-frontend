<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050608">
  <title>KDX Ripple Floor</title>
  <link rel="stylesheet" href="./kodex-ripple.css">
</head>
<body>
  <main class="kdx-ripple" data-kdx-ripple data-state="0">
    <canvas class="kdx-ripple__canvas" aria-hidden="true"></canvas>
    <div class="kdx-fallback" aria-hidden="true"></div>

    <div class="kdx-shell">
      <header class="kdx-header">
        <div class="kdx-logo">KODEX−∞</div>
        <div class="kdx-header__right">
          <span class="kdx-dot"></span>
          <span>MEMBRANE · LIVE</span>
          <span>KDX_04</span>
        </div>
      </header>

      <section class="kdx-main">
        <div class="kdx-copy">
          <p class="kdx-kicker">04 / 08 · SURFACE RESPONSE PROTOCOL</p>
          <h1 class="kdx-title">THE FLOOR WAS NEVER SOLID.</h1>
          <p class="kdx-description">
            Touch the grid. Every signal becomes displacement, memory and a
            navigable rupture in the surface.
          </p>

          <div class="kdx-actions">
            <button class="kdx-cta" type="button" data-kdx-activate>
              BREAK THE SURFACE →
            </button>
            <button
              class="kdx-mic"
              type="button"
              data-kdx-mic
              aria-label="Activate microphone response"
              aria-pressed="false"
            >
              MIC
            </button>
          </div>
        </div>

        <div aria-hidden="true"></div>

        <aside class="kdx-rail">
          <div>State<strong data-kdx-state>DORMANT</strong></div>
          <div>Surface<strong>MEMBRANE</strong></div>
          <div>Impact<strong>TOUCH</strong></div>
          <div>FPS<strong data-kdx-fps>—</strong></div>
        </aside>
      </section>

      <footer class="kdx-footer">
        <span>PREVIOUS</span>
        <span class="kdx-progress" aria-hidden="true"></span>
        <span class="kdx-footer__index">04 / 08 · INDEX</span>
      </footer>
    </div>
  </main>

  <script type="module" src="./kodex-ripple.js"></script>
</body>
</html>
