<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#050608">
  <title>KDX Wrinkled Reality</title>
  <link rel="stylesheet" href="./kodex-wrinkle.css">
</head>
<body>
  <main
    class="kdx-wrinkle"
    data-kdx-wrinkle
    data-state="0"
  >
    <canvas
      class="kdx-wrinkle__canvas"
      aria-hidden="true"
    ></canvas>

    <div
      class="kdx-fallback"
      aria-hidden="true"
    ></div>

    <div class="kdx-shell">
      <header class="kdx-header">
        <div class="kdx-logo">
          KODEX−∞
        </div>

        <div class="kdx-header__right">
          <span class="kdx-dot"></span>
          <span>REALITY · DEFORMING</span>
          <span>KDX_06</span>
        </div>
      </header>

      <section class="kdx-main">
        <div class="kdx-copy">
          <p class="kdx-kicker">
            06 / 08 · TOPOLOGICAL STRESS PROTOCOL
          </p>

          <h1 class="kdx-title">
            REALITY WRINKLES AROUND THE SIGNAL.
          </h1>

          <p class="kdx-description">
            Touch the field to create a crease.
            The room, the grid and the horizon
            deform as one continuous membrane.
          </p>

          <div class="kdx-actions">
            <button
              class="kdx-cta"
              type="button"
              data-kdx-activate
            >
              FOLD THE FIELD →
            </button>

            <button
              class="kdx-mic"
              type="button"
              data-kdx-mic
              aria-label="Activate microphone response"
              aria-pressed="false"
            >
              MIC
            </button>
          </div>
        </div>

        <div aria-hidden="true"></div>

        <aside class="kdx-rail">
          <div>
            State
            <strong data-kdx-state>
              DORMANT
            </strong>
          </div>

          <div>
            Crease
            <strong data-kdx-crease>
              DORMANT
            </strong>
          </div>

          <div>
            Topology
            <strong>
              MEMBRANE
            </strong>
          </div>

          <div>
            FPS
            <strong data-kdx-fps>
              —
            </strong>
          </div>
        </aside>
      </section>

      <footer class="kdx-footer">
        <span>PREVIOUS</span>

        <span
          class="kdx-progress"
          aria-hidden="true"
        ></span>

        <span class="kdx-footer__index">
          06 / 08 · INDEX
        </span>
      </footer>
    </div>
  </main>

  <script
    type="module"
    src="./kodex-wrinkle.js"
  ></script>
</body>
</html>
