  .kdx-lime { color: #A6FF00; }
  .kdx-cyan { color: #00F0FF; }
  .kdx-violet { color: #8A5CFF; }
  .kdx-magenta { color: #FF00C8; }
  .kdx-orange { color: #FF6A00; }
  .kdx-red { color: #FF3038; }
  .fill-current { fill: currentColor; }
  .stroke-current { fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; }
  .hairline { vector-effect: non-scaling-stroke; }
</style>

