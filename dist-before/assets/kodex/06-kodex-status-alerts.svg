<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" style="color:#E6E6E6;background:transparent">
<title id="title">KODEX status chips and alerts</title><desc id="desc">Original modular vector asset for the KODEX visual system.</desc>

<style>
  :root { --kdx-off:#E6E6E6; --kdx-lime:#A6FF00; --kdx-cyan:#00F0FF; --kdx-violet:#8A5CFF; --kdx-magenta:#FF00C8; --kdx-orange:#FF6A00; --kdx-red:#FF3038; }
  .kdx-main { color: #E6E6E6; }
  .kdx-lime { color: #A6FF00; }
  .kdx-cyan { color: #00F0FF; }
  .kdx-violet { color: #8A5CFF; }
  .kdx-magenta { color: #FF00C8; }
  .kdx-orange { color: #FF6A00; }
  .kdx-red { color: #FF3038; }
  .fill-current { fill: currentColor; }
  .stroke-current { fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; }
  .hairline { vector-effect: non-scaling-stroke; }
</style>

<defs></defs>
<g id="status-active" transform="translate(70 70)" class="kdx-lime"><rect width="210" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="24" r="7" fill="currentColor"/><text x="46" y="31" fill="currentColor" font-family="ui-monospace,monospace" font-size="18" letter-spacing="1">ACTIVE</text></g><g id="status-scanning" transform="translate(320 70)" class="kdx-cyan"><rect width="230" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="24" r="7" fill="currentColor"/><text x="46" y="31" fill="currentColor" font-family="ui-monospace,monospace" font-size="18" letter-spacing="1">SCANNING</text></g><g id="status-archived" transform="translate(590 70)" class="kdx-violet"><rect width="240" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="24" r="7" fill="currentColor"/><text x="46" y="31" fill="currentColor" font-family="ui-monospace,monospace" font-size="18" letter-spacing="1">ARCHIVED</text></g><g id="status-warning" transform="translate(870 70)" class="kdx-orange"><rect width="230" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="24" r="7" fill="currentColor"/><text x="46" y="31" fill="currentColor" font-family="ui-monospace,monospace" font-size="18" letter-spacing="1">WARNING</text></g><g id="status-error" transform="translate(1140 70)" class="kdx-red"><rect width="190" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="24" r="7" fill="currentColor"/><text x="46" y="31" fill="currentColor" font-family="ui-monospace,monospace" font-size="18" letter-spacing="1">ERROR</text></g><g id="status-offline" transform="translate(1370 70)" class="kdx-main"><rect width="170" height="48" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="24" r="7" fill="currentColor"/><text x="46" y="31" fill="currentColor" font-family="ui-monospace,monospace" font-size="18" letter-spacing="1">OFFLINE</text></g><g id="alert-notice" transform="translate(120 200)" class="kdx-cyan"><rect width="1360" height="110" rx="6" fill="none" stroke="currentColor" stroke-width="3"/><path d="M24 84V24H84" stroke="currentColor" stroke-width="7" fill="none"/><circle cx="55" cy="55" r="18" fill="none" stroke="currentColor" stroke-width="4"/><text x="115" y="45" fill="currentColor" font-family="ui-monospace,monospace" font-size="24" font-weight="700">NOTICE</text><text x="115" y="77" fill="#E6E6E6" font-family="ui-monospace,monospace" font-size="18">A new signal has entered the archive.</text></g><g id="alert-warning" transform="translate(120 350)" class="kdx-orange"><rect width="1360" height="110" rx="6" fill="none" stroke="currentColor" stroke-width="3"/><path d="M24 84V24H84" stroke="currentColor" stroke-width="7" fill="none"/><circle cx="55" cy="55" r="18" fill="none" stroke="currentColor" stroke-width="4"/><text x="115" y="45" fill="currentColor" font-family="ui-monospace,monospace" font-size="24" font-weight="700">WARNING</text><text x="115" y="77" fill="#E6E6E6" font-family="ui-monospace,monospace" font-size="18">Signal integrity is below threshold.</text></g><g id="alert-critical" transform="translate(120 500)" class="kdx-red"><rect width="1360" height="110" rx="6" fill="none" stroke="currentColor" stroke-width="3"/><path d="M24 84V24H84" stroke="currentColor" stroke-width="7" fill="none"/><circle cx="55" cy="55" r="18" fill="none" stroke="currentColor" stroke-width="4"/><text x="115" y="45" fill="currentColor" font-family="ui-monospace,monospace" font-size="24" font-weight="700">CRITICAL</text><text x="115" y="77" fill="#E6E6E6" font-family="ui-monospace,monospace" font-size="18">System connection lost. Retry protocol.</text></g><g id="alert-archived" transform="translate(120 650)" class="kdx-violet"><rect width="1360" height="110" rx="6" fill="none" stroke="currentColor" stroke-width="3"/><path d="M24 84V24H84" stroke="currentColor" stroke-width="7" fill="none"/><circle cx="55" cy="55" r="18" fill="none" stroke="currentColor" stroke-width="4"/><text x="115" y="45" fill="currentColor" font-family="ui-monospace,monospace" font-size="24" font-weight="700">ARCHIVED</text><text x="115" y="77" fill="#E6E6E6" font-family="ui-monospace,monospace" font-size="18">Pattern preserved and indexed.</text></g>
</svg>