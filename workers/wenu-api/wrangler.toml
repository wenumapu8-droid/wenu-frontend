# wrangler.toml is the format this migration phase asked for.
# No routes, no custom domain, workers_dev off: this file cannot attach
# api.wenumapuonline.com. Deploy only after Nico writes APROBAR DEPLOY.
name = "wenu-api"
main = "src/index.ts"
compatibility_date = "2026-11-14"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[vars]
SITE_ORIGIN = "https://wenumapuonline.com"
# Cart prices are US dollars. This does not convert currency.
MERCADOPAGO_CURRENCY = "USD"
# Public From address already used by the store. Not a secret. Unused until mail phases.
MAIL_FROM = "Wenu Mapu <marimari@wenumapuonline.com>"
OWNER_NOTIFY_EMAIL = "wenu.mapu8@gmail.com"

# Names only. Values are never written here.
[secrets]
required = ["MERCADOPAGO_ACCESS_TOKEN"]

[[d1_databases]]
binding = "DB"
database_name = "wenu"
# Placeholder on purpose. Omitting database_id lets Wrangler provision a real
# D1 database on deploy. Replace this id with the output of
# `npx wrangler d1 create wenu` only after APROBAR DEPLOY.
database_id = "00000000-0000-4000-8000-000000000001"

# Mail queue is not bound. Create it only after APROBAR DEPLOY, when a later
# phase sends mail:
#   npx wrangler queues create wenu-mail
# Then add:
# [[queues.producers]]
# binding = "MAIL_QUEUE"
# queue = "wenu-mail"
