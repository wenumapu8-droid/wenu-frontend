# ─────────────────────────────────────────────────────────────────────
# KODEX-∞ · SCENE CONTRACT
# Congelado 2026-08-29 tras la pasada Hi-Fi.
# Autoridad: ~/kodex-relevo/DECISION-LOG-2026-08-29-AUTORIDAD-HIFI.md
#
# LAS CUATRO CAPAS, que no se mezclan:
#   Scene Contract = especificacion   Hi-Fi = apariencia
#   Codigo         = implementacion   Tests = evidencia
#
# Campo desconocido va como HUECO o NEEDS_CONFIRMATION. NUNCA inventado.
# La pregunta antes de escribir un valor no es "es razonable?" sino
# "que fuente lo dice, y esa fuente puede saberlo?".
# ─────────────────────────────────────────────────────────────────────

scene_id: KDX-06-RET-2026
route: /kodex/folio/vi/
position: "06 / 06"          # corredor principal de 7 escenas, 00-06

visual_target:
  file: KDX_UI_06_RETURN_WHITE_HIFI.png
  folder: "Kodex / 02 - KODEX PAGE MOCKUPS / 2026-08-29 - KODEX HI-FI SCENE TARGETS"
  classification: VISUAL_REFERENCE
  # Manda en composicion, color, jerarquia, dimensionalidad, materialidad,
  # profundidad, densidad y lenguaje de UI. NO en copy, CTA, datos ni IDs.

canonical_copy:
  source: BOARD_2026_08_27          # NO el Hi-Fi. Autoridad 2 y 9.
  title: "RETURN DIFFERENT. CARRY THE MEMORY."
  subtitle: "TRANSFORMATION COMPLETE. YOU ARE THE CONTINUATION."

cta:
  source: BOARD_2026_08_27
  label: "RETURN WITH MEMORY"

palette:
  # ─── REGLA DE COLOR · Decision Log 2026-08-29 (B) ───────────────────
  # El color de KODEX vive en MARCOS, SEÑALES, PARTICULAS, MICRO-UI,
  # ILUMINACION y PROFUNDIDAD. NUNCA colorea la obra.
  #
  # Por eso reasignar el acento NO contradice la nota vigente de que los
  # colores por escena son intencionales: esa nota gobierna la identidad
  # de escena, esta regla gobierna donde se aplica. Son capas distintas.
  #
  # La pieza original conserva su blanco/negro o sus colores reales.
  # KODEX no se come la obra.
  chassis_accent: BLANCO — CANONICAL
  chassis_accent_name: blanco
  previous_value: ácido #A7FF00    # reasignado por la decision B
  artwork_treatment: NUNCA_RECOLOREAR
  ground: BLANCO - CANONICAL, decision explicita del creador

composition_mode:
  source: HIFI_2026_08_29           # aca SI manda el Hi-Fi
  value: NEEDS_CONFIRMATION         # requiere lectura en pixel, no OCR

central_organism: "return-seal · convergencia radial del recorrido"

visible_states:                      # los 5 del carril, identicos en las 10 laminas
  - DORMANT
  - AWARE
  - OPEN
  - CROSSED
  - REMEMBERED
  # OBSERVE NO pertenece al carril: es microtexto vertical lateral (autoridad 5)

runtime_mapping:                     # presentacion y motor difieren A PROPOSITO
  DORMANT: idle
  AWARE: aware
  OPEN: locked
  CROSSED: active
  REMEMBERED: transitionOut
  note: >
    El motor de escena (estado.ts) tiene 5 estados. El de observacion
    (observacion.ts, solo PROLOGUE) tiene 6: DORMANT AWARE LOCK TRACK
    INSPECT DESCEND. El carril colapsa LOCK/TRACK/INSPECT/DESCEND bajo
    CROSSED; ese colapso es deliberado y el sub-estado se reporta en la luz.

allowed_mockTelemetry:               # decorativo, MARCADO. Nunca medicion.
  classification: GENERATED_VISUAL_TELEMETRY
  source: HIFI_2026_08_29
  note: >
    Los numeros de las laminas (98.7%, 99.7%, 100%, 87 BPM, 1.12, DEPTH,
    coordenadas) son arte generado. Repetirse en 10 laminas no los vuelve
    medicion: 10 laminas del mismo generador son UNA fuente, no diez.
    Si se usan para paridad visual van como mockTelemetry marcado.
  values: NEEDS_CONFIRMATION

interaction:
  - el sello se genera segun el recorrido real, no segun un preset

responsive:
  desktop: segun visual_target
  mobile: >
    Composicion TEMPORAL, no desktop encogido. Coreografia 1o/2o/3o/4o
    y drawer para lo que no entra.
  breakpoints: [900, 700]

fallback:
  reduced_motion: obligatorio - ancla estatica, sin latido
  no_webgl: NEEDS_CONFIRMATION
  no_audio: la voz no arranca sola; respeta sessionStorage["kx-audio"]

owned_files:
  # Ruta dinamica COMPARTIDA por las 6 escenas del folio: nadie la posee
  # en exclusiva. Quien la toque edita SOLO su rama de sceneByFolio.
  - shared: src/pages/kodex/folio/[folio].astro
  #   rama propia: sceneByFolio.vi
  # vi
  - src/components/kodex/os/EspecimenRetorno.astro
  - src/pages/kodex/return.astro

forbidden_files:
  - src/lib/kodex/estado.ts          # maquina compartida: no se toca por escena
  - src/data/kodex-atlas.json        # transcripcion literal de Drive
  - src/styles/tokens.css            # tokens globales
  - src/lib/woo.ts                   # fuente de productos, ajena a KODEX

atlas_concepts:                      # de src/data/kodex-atlas.json
    - KDX-IMG-001
    - KDX-IMG-003
    - KDX-IMG-005
    - KDX-IMG-016
    - KDX-IMG-031
    - KDX-IMG-036
    - KDX-IMG-040

