# ─────────────────────────────────────────────────────────────────────
# KODEX-∞ · MOTIVOS RECURRENTES
# Decision Log 2026-08-29 (B).
#
# "Algunos motivos pueden reaparecer transformados en distintas escenas.
#  Eso crea MEMORIA VISUAL REAL en vez de siete páginas desconectadas."
#
# Un motivo NO es un asset repetido. Es la MISMA forma cumpliendo funciones
# distintas a lo largo del viaje. Si el visitante no la reconoce al volver
# a verla, el motivo falló.
# ─────────────────────────────────────────────────────────────────────

motifs:
  - id: KDX-MOTIF-TOROIDE
    name: Toroide blanco/negro
    art_family: Campos toroidales y geometrías rotacionales
    source_artwork: NEEDS_CONFIRMATION   # pieza concreta, la asigna el creador
    thread: >
      El caso que el creador declaró explícitamente. La misma forma cambia
      de función cuatro veces sin cambiar de identidad.
    appearances:
      - scene: 00-threshold
        role: SIMBOLO_LATENTE
        note: aparece como marca, todavía sin función
      - scene: 04-machine
        role: MAQUINA
        note: la forma se revela como motor - ciclos dentro de ciclos
      - scene: 05-cosmology
        role: MAPA
        note: la misma geometría leída como mapa de relaciones
      - scene: 06-return
        role: INVERSION
        note: se invierte hacia blanco puro. Cierra reconociéndose.
    rule: >
      Nunca recoloreado. La continuidad la carga la FORMA, no el color -
      el color pertenece al chasis y cambia por escena a propósito.

# ── candidatos, sin confirmar ──────────────────────────────────────────
# El creador nombró familias que podrían tejer hilos parecidos. No los
# declaro como motivos hasta que él los reconozca como tales: un motivo
# inventado por un agente es peor que ninguno.
candidates:
  - id: KDX-MOTIF-TUNEL
    hypothesis: DESCENT (regresión) podría reaparecer invertido en RETURN
    status: NEEDS_CONFIRMATION
  - id: KDX-MOTIF-GLIFO
    hypothesis: los glifos de ARCHIVE podrían sembrarse en PROLOGUE
    status: NEEDS_CONFIRMATION

# ── qué NO es un motivo ────────────────────────────────────────────────
anti_pattern: >
  Repetir el mismo mandala con otro color. Regla explícita del creador:
  "evitar que todas las escenas sean el mismo mandala con otro color".
  Coherencia global, identidad local.
