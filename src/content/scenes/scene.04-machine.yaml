  # Familia del portfolio real de Ocin. NO se genera arte parecido:
  # se usa la obra como materia del sistema.

  motif: "EL MOTOR RECUERDA — ciclos dentro de ciclos"

  fragmentation: "SECUENCIA de transformación: 4 pasos con flechas, el toroide rotando"
  # Obra completa + macrodetalles + recortes + inversiones + secuencia +
  # informacion tecnica. El original SIEMPRE reconocible.

  source_artwork: NEEDS_CONFIRMATION
  # Pieza concreta del portfolio, por ID. La asigna el creador, no se infiere.

behavior_by_state:
  # "No es una galeria estatica": la obra cambia de comportamiento.
  # La forma la define el visual_target; el dato va como hueco o mock marcado.
  DORMANT: NEEDS_CONFIRMATION
  AWARE: NEEDS_CONFIRMATION
  OPEN: NEEDS_CONFIRMATION
  CROSSED: NEEDS_CONFIRMATION
  REMEMBERED: NEEDS_CONFIRMATION

