rights_gate:
  status: BLOQUEADO
  registry_says:
    PUBLICATION_STATUS: NOT_APPROVED_FOR_PUBLIC_EXPORT
    RIGHTS_STATUS: "CREATOR-OWNED / PUBLIC USE REQUIRES EXPLICIT APPROVAL"
    publicly_approved_count: 0        # de 25 obras del seed
  rule: >
    NINGUNA obra puede montarse en el sitio publico hasta que el registry
    la marque aprobada. El registry es explicito: cero aprobaciones sobre
    veinticinco. Cablearlas ahora contradiria la autoridad autoral que el
    propio registry declara.
    Se puede especificar el cableado. No se puede publicar.

candidate_artworks:
  # De la hoja Works del registry. PROPOSED: la asignacion final es
  # curaduria del creador, no inferencia del agente.
  - ocin_id: OCN-SQR-001
    public_title: "Open Archive Frame"
    family: 03_GEOMETRIA_CUADRADA
    registry_kodex_scenes: "ARCHIVE, MACHINE"
    truth_status: VERIFIED
    status: PROPOSED

acceptance_tests:
  - gate de experiencia pasa (organismo 100% viewport, vida en reposo bajo el techo de ruido, causalidad idle->aware)
  - el copy renderizado coincide EXACTO con canonical_copy
  - el carril muestra los 5 estados visibles y ninguno mas
  - ningun numero en pantalla sin data-fuente REAL o HUECO declarado
  - build verde con ALLOW_EMPTY_PRODUCTS=true
  - sin overflow horizontal a 375px
  - prefers-reduced-motion honrado

notes: >
  Hi-Fi y board COINCIDEN aca: subtitulo y CTA identicos. Eso da confianza en la lectura de los targets.
