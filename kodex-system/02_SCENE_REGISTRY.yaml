# KODEX SCENE REGISTRY · Integration OS
# Consolidado 2026-08-30 desde:
#   - src/content/scenes/scene.NN-*.yaml (7 contratos autorales)
#   - src/lib/kodex/escenas/*.ts (6 SceneDefinition de la biblia P0)
#   - src/pages/kodex/chamber/**/index.astro (4 chamber routes vivas)
#   - src/lib/kodex/atlas.ts + nodosDeEscena()
#   - kodex-system/01_CURRENT_STATE.yaml
#
# Regla dura: cualquier disparidad entre estas fuentes es un DRIFT a
# reconciliar, no una tolerancia. Si algo dice A en yaml y B en escenas/*.ts,
# se declara aqui, no se resuelve en silencio.

schema_version: 1
generated_at: "2026-08-30"
authority_sources:
  - src/content/scenes/AUTHORITIES.yaml
  - src/content/scenes/scene.00-06-*.yaml
  - src/lib/kodex/escenas/*.ts
  - src/lib/kodex/atlas.ts

totals:
