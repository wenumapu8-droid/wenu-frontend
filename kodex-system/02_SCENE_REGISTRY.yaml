  scenes_with_yaml_contract: 7  # las 7 del corredor
  scenes_with_ts_definition: 6  # threshold + return + 4 chambers de la biblia
  atlas_nodes_wired: 32         # de 40 totales (36 poblados, los 4 placeholders 017-020 quedan HUECO)

