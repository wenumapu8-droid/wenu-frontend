tipo_de_fuente:
  regla: |
    "Una referencia visual no es lo mismo que una pieza fuente de tu arte."

    Una dice COMO DEBERIA VERSE. La otra ES lo que se muestra. Si el
    sistema no las separa, termina publicando el mockup de una escena en
    lugar de la escena.

    El riesgo no era teorico: 71 de los 89 mockups declaran un *_RENDERER
    como wiring_target. Hasta el 2026-09-01 puedeMontarse() devolvia ok
    para un mockup contra THRESHOLD_RENDERER, exactamente igual que para
    una obra real.

  derivacion: |
    El eje ya estaba en los datos sin nombre. El corpus lo separa limpio,
    verificado sobre las 119 filas:

      OCIN_COLLAGE          -> SOURCE_ART      10   unico corpus 100% APPROVED_*
      MCK                   -> REFERENCE       89
      HIFI                  -> REFERENCE       10   targets de diseno
      USER_RUNTIME_CAPTURE  -> REFERENCE        3   BKS
      KDX-CAN_FAMILY        -> ALREADY_WIRED    7   canon ya montado

    No hace falta reorganizar carpetas ni crear bibliotecas nuevas: hace
    falta nombrar el eje y hacerlo exigible.

  exigible_desde_codigo:
    tipoDeFuente: "SOURCE_ART | REFERENCE | ALREADY_WIRED"
    arteFuente: "las 10 piezas reales; lo unico que se monta como arte"
    guiaVisualDe: "dado un renderer, las referencias que dicen como debe verse"
    puedeMontarse: "rechaza toda REFERENCE y devuelve que preservar al construir"

  uso_productivo_de_los_89: |
    Los mockups no se montan, pero no son descarte: son la ESPECIFICACION
    del renderer. guiaVisualDe('ARCHIVE_RENDERER') devuelve el lenguaje
    visual que ese renderer tiene que cumplir.

