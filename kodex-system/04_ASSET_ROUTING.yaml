regla_dura: |
  Ningun agente elige una imagen porque diga CANON_ASSET.

  Antes de montar cualquier visual hay que leer su fila y respetar:
    preserve         -- que hay que conservar (criterio de no-regresion)
    do_not_use_as    -- que esta PROHIBIDO hacer con ella
    provenance_gate  -- si no es NONE, no se monta hasta resolverla
    wiring_target    -- su destino declarado, y ningun otro

  Exigible desde codigo: visualJourney.puedeMontarse(asset, destino).
  Devuelve el motivo cuando la respuesta es no.

  El error que esto corrige: una mascara o un craneo son SPECIMEN y
  llegaron a reemplazar el universo entero de ARCHIVE como macro-fondo.

