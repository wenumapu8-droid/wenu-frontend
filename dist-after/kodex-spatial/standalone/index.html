<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050608" />
  <title>KODEX Spatial Engine v1</title>
  <link rel="stylesheet" href="./kodex-spatial.css" />
</head>
<body>
  <main class="kdx-shell" data-mode="0">
    <canvas id="kdx-canvas" aria-label="KODEX real-time non-Euclidean corridor"></canvas>

    <div class="kdx-noise" aria-hidden="true"></div>

    <header class="kdx-topbar">
      <div class="kdx-logo">KODEX−∞</div>
      <div class="kdx-signal"><span class="dot"></span> SIGNAL · LIVE</div>
      <button class="kdx-index" type="button" data-action="mic">MIC · OFF</button>
    </header>

    <section class="kdx-copy">
      <p class="eyebrow">03 / SPATIAL DISTORTION PROTOCOL</p>
      <h1>THE CORRIDOR<br>DOES NOT LEAD.<br>IT DECIDES.</h1>
      <p class="bodycopy">Perspective is not a camera setting. It is an active signal.</p>
      <div class="kdx-tags">
        <span>NODE · S-03</span><span>STATUS · ACTIVE</span><span>SPACE · NON-EUCLIDEAN</span>
      </div>
    </section>

    <aside class="kdx-mode-panel" aria-label="Spatial modes">
      <button class="is-active" data-mode="0"><b>01</b> DUAL VANISH</button>
      <button data-mode="1"><b>02</b> RIPPLE FLOOR</button>
      <button data-mode="2"><b>03</b> SPLIT CORRIDOR</button>
      <button data-mode="3"><b>04</b> WRINKLED REALITY</button>
    </aside>

    <button class="kdx-enter" type="button" data-action="activate">
      <span>ACTIVATE DISTORTION</span><i>→</i>
    </button>

    <footer class="kdx-deckbar">
      <span>02 / 07</span>
      <div class="progress" aria-hidden="true"><i></i><i></i><i class="active"></i><i></i><i></i><i></i><i></i></div>
      <button type="button" data-action="next">NEXT MODE ›</button>
      <span>INDEX</span>
    </footer>

    <div class="kdx-diagnostics" aria-live="polite">
      <span id="fps">FPS --</span>
      <span id="mode-label">DUAL VANISH</span>
      <span id="gpu">WEBGL2</span>
    </div>
  </main>

  <script type="module" src="./kodex-spatial.js"></script>
</body>
</html>
