<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" role="img" aria-label="Amulets — sky iron, Atacama meteorite">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#1A1714"/>
      <stop offset="70%" stop-color="#0E0B09"/>
      <stop offset="100%" stop-color="#080706"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <!-- meteor halo glow -->
  <circle cx="360" cy="280" r="48" fill="#C4935A" opacity="0.18" filter="url(#glow)"/>
  <!-- meteor scaled from icon-meteor (viewBox 0 0 48 48) -->
  <g transform="translate(170 130) scale(7.0)" fill="none" stroke="#F2EDE4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="32" cy="14" r="5" fill="#F2EDE4"/>
    <path d="M28 18 L8 38" stroke-width="2.0"/>
    <path d="M28 18 L10 32" stroke-width="1.0" opacity="0.55"/>
    <path d="M28 18 L14 38" stroke-width="1.0" opacity="0.55"/>
    <circle cx="32" cy="14" r="2" fill="#080706"/>
  </g>
  <!-- texto AMULETS estilo brand -->
  <text x="300" y="700" text-anchor="middle" font-family="'DM Serif Display', serif" font-size="56" letter-spacing="6" fill="#F2EDE4">AMULETS</text>
  <text x="300" y="735" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" letter-spacing="3" fill="#8A6A43" opacity="0.85">Sky iron · Atacama · Worn close</text>
</svg>
