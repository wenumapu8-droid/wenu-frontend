<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc" style="color:#E6E6E6;background:transparent">
<title id="title">KODEX UI buttons</title><desc id="desc">Original modular vector asset for the KODEX visual system.</desc>

<style>
  :root { --kdx-off:#E6E6E6; --kdx-lime:#A6FF00; --kdx-cyan:#00F0FF; --kdx-violet:#8A5CFF; --kdx-magenta:#FF00C8; --kdx-orange:#FF6A00; --kdx-red:#FF3038; }
  .kdx-main { color: #E6E6E6; }
  .kdx-lime { color: #A6FF00; }
  .kdx-cyan { color: #00F0FF; }
  .kdx-violet { color: #8A5CFF; }
  .kdx-magenta { color: #FF00C8; }
  .kdx-orange { color: #FF6A00; }
  .kdx-red { color: #FF3038; }
  .fill-current { fill: currentColor; }
  .stroke-current { fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; }
  .hairline { vector-effect: non-scaling-stroke; }
</style>

<defs></defs>
<g id="btn-enter" transform="translate(70 70)" class="kdx-lime">
      <rect x="0" y="0" width="350" height="70" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M8 0H42M308 0H342M8 70H42M308 70H342" stroke="currentColor" stroke-width="6"/>
      <text x="175.0" y="42.0" fill="currentColor" text-anchor="middle" font-family="ui-monospace,monospace" font-size="20" letter-spacing="2">ENTER THE KODEX</text>
      
    </g><g id="btn-observe" transform="translate(470 70)" class="kdx-cyan">
      <rect x="0" y="0" width="350" height="70" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M8 0H42M308 0H342M8 70H42M308 70H342" stroke="currentColor" stroke-width="6"/>
      <text x="175.0" y="42.0" fill="currentColor" text-anchor="middle" font-family="ui-monospace,monospace" font-size="20" letter-spacing="2">BEGIN OBSERVATION</text>
      
    </g><g id="btn-archive" transform="translate(870 70)" class="kdx-orange">
      <rect x="0" y="0" width="300" height="70" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M8 0H42M258 0H292M8 70H42M258 70H292" stroke="currentColor" stroke-width="6"/>
      <text x="150.0" y="42.0" fill="currentColor" text-anchor="middle" font-family="ui-monospace,monospace" font-size="20" letter-spacing="2">OPEN ARCHIVE</text>
      
    </g><g id="btn-generate" transform="translate(1220 70)" class="kdx-violet">
      <rect x="0" y="0" width="300" height="70" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M8 0H42M258 0H292M8 70H42M258 70H292" stroke="currentColor" stroke-width="6"/>
      <text x="150.0" y="42.0" fill="currentColor" text-anchor="middle" font-family="ui-monospace,monospace" font-size="20" letter-spacing="2">GENERATE SIGNAL</text>
      
    </g><g id="btn-secondary" transform="translate(70 200)" class="kdx-main">
      <rect x="0" y="0" width="260" height="58" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M8 0H42M218 0H252M8 58H42M218 58H252" stroke="currentColor" stroke-width="6"/>
      <text x="130.0" y="36.0" fill="currentColor" text-anchor="middle" font-family="ui-monospace,monospace" font-size="20" letter-spacing="2">RETURN</text>
      
    </g><g id="btn-ghost" transform="translate(370 200)" class="kdx-main">
      <rect x="0" y="0" width="260" height="58" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M8 0H42M218 0H252M8 58H42M218 58H252" stroke="currentColor" stroke-width="6"/>
      <text x="130.0" y="36.0" fill="currentColor" text-anchor="middle" font-family="ui-monospace,monospace" font-size="20" letter-spacing="2">VIEW DETAILS</text>
      
    </g><g id="btn-destructive" transform="translate(670 200)" class="kdx-red">
      <rect x="0" y="0" width="300" height="58" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M8 0H42M258 0H292M8 58H42M258 58H292" stroke="currentColor" stroke-width="6"/>
      <text x="150.0" y="36.0" fill="currentColor" text-anchor="middle" font-family="ui-monospace,monospace" font-size="20" letter-spacing="2">DELETE SIGNAL</text>
      
    </g><g id="btn-license" transform="translate(1010 200)" class="kdx-cyan">
      <rect x="0" y="0" width="300" height="58" rx="4" fill="none" stroke="currentColor" stroke-width="3"/>
      <path d="M8 0H42M258 0H292M8 58H42M258 58H292" stroke="currentColor" stroke-width="6"/>
      <text x="150.0" y="36.0" fill="currentColor" text-anchor="middle" font-family="ui-monospace,monospace" font-size="20" letter-spacing="2">LICENSE A SIGNAL</text>
      
    </g><g id="icon-prev" transform="translate(70 340)" class="kdx-main stroke-current" stroke-width="4"><rect width="72" height="64" rx="6"/><g transform="translate(4 0)"><path d="M42 16L24 32L42 48"/></g></g><g id="icon-next" transform="translate(180 340)" class="kdx-main stroke-current" stroke-width="4"><rect width="72" height="64" rx="6"/><g transform="translate(4 0)"><path d="M22 16L40 32L22 48"/></g></g><g id="icon-index" transform="translate(290 340)" class="kdx-lime stroke-current" stroke-width="4"><rect width="72" height="64" rx="6"/><g transform="translate(4 0)"><path d="M14 14H24V24H14ZM32 14H42V24H32ZM14 32H24V42H14ZM32 32H42V42H32Z"/></g></g><g id="icon-close" transform="translate(400 340)" class="kdx-red stroke-current" stroke-width="4"><rect width="72" height="64" rx="6"/><g transform="translate(4 0)"><path d="M18 18L46 46M46 18L18 46"/></g></g><g id="icon-audio" transform="translate(510 340)" class="kdx-cyan stroke-current" stroke-width="4"><rect width="72" height="64" rx="6"/><g transform="translate(4 0)"><path d="M14 27H24L36 17V47L24 37H14Z M43 24Q53 32 43 40"/></g></g><g id="cta-solid-lime" transform="translate(70 470)" class="kdx-lime"><rect width="420" height="78" rx="4" fill="currentColor"/><text x="210" y="49" fill="#0A0A0A" text-anchor="middle" font-family="ui-monospace,monospace" font-weight="700" font-size="22" letter-spacing="2">COLLECT A FRAGMENT</text></g><g id="cta-solid-violet" transform="translate(540 470)" class="kdx-violet"><rect width="420" height="78" rx="4" fill="currentColor"/><text x="210" y="49" fill="#0A0A0A" text-anchor="middle" font-family="ui-monospace,monospace" font-weight="700" font-size="22" letter-spacing="2">COMMISSION A SYSTEM</text></g><g id="cta-solid-cyan" transform="translate(1010 470)" class="kdx-cyan"><rect width="420" height="78" rx="4" fill="currentColor"/><text x="210" y="49" fill="#0A0A0A" text-anchor="middle" font-family="ui-monospace,monospace" font-weight="700" font-size="22" letter-spacing="2">LICENSE A SIGNAL</text></g>
</svg>