<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>KODEX Micrographics Kit</title>
  <style>
    :root { --bg:#07070a; --fg:#e8e6df; --accent:#9a7cff; --line:rgba(154,124,255,.25); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; color:var(--fg); background:radial-gradient(circle at 52% 20%,rgba(154,124,255,.08),transparent 28%),var(--bg); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    body::after { content:""; position:fixed; inset:0; pointer-events:none; opacity:.18; background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.025) 4px); }
    main { width:min(1180px,94vw); margin:auto; padding:48px 0 72px; }
    header { display:flex; justify-content:space-between; gap:20px; align-items:end; border-bottom:1px solid var(--line); padding-bottom:18px; }
    h1 { margin:0; font-size:clamp(2rem,7vw,5rem); letter-spacing:-.07em; line-height:.85; }
    header p { max-width:40ch; margin:0; color:#a6a2ad; font-size:.78rem; letter-spacing:.12em; line-height:1.7; }
    .meta { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 24px; }
    .chip { border:1px solid var(--line); padding:7px 10px; color:var(--accent); font-size:.72rem; letter-spacing:.14em; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); }
    .item { min-height:180px; background:var(--bg); padding:18px; display:grid; align-content:space-between; position:relative; overflow:hidden; }
    .item::before { content:attr(data-code); position:absolute; right:8px; top:8px; font-size:.58rem; color:#716a7b; letter-spacing:.12em; }
    .item svg { width:88px; height:88px; color:var(--accent); filter:drop-shadow(0 0 8px rgba(154,124,255,.18)); overflow:visible; }
    .item strong { font-size:.75rem; font-weight:500; letter-spacing:.14em; text-transform:uppercase; }
    .item small { display:block; margin-top:5px; color:#817b88; font-size:.64rem; letter-spacing:.1em; }
    .spin { animation:spin 12s linear infinite; transform-origin:center; }
    .reverse { animation:spin 15s linear infinite reverse; transform-origin:center; }
    .pulse { animation:pulse 3s ease-in-out infinite; transform-origin:center; }
    .drift { animation:drift 5s ease-in-out infinite alternate; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @keyframes pulse { 0%,100%{opacity:.55;transform:scale(.94)} 50%{opacity:1;transform:scale(1.05)} }
    @keyframes drift { from{transform:translate(-2px,1px)} to{transform:translate(3px,-2px)} }
    footer { margin-top:18px; display:flex; justify-content:space-between; color:#726d79; font-size:.65rem; letter-spacing:.12em; }
    @media (max-width:650px){ header{align-items:start;flex-direction:column}.grid{grid-template-columns:repeat(2,1fr)}.item{min-height:150px} }
    @media (prefers-reduced-motion:reduce){ *{animation:none!important} }
  </style>
</head>
<body>
<main>
  <header>
    <div><h1>KODEX–∞</h1><p>MICROGRAPHICS / ORIGINAL SYSTEM INGREDIENTS</p></div>
    <p>Vector primitives for archive interfaces, techno-flyers, signal systems and live HUD compositions.</p>
  </header>
  <div class="meta"><span class="chip">23 SYMBOLS</span><span class="chip">SVG SPRITE</span><span class="chip">ASTRO READY</span><span class="chip">MOTION SAFE</span></div>
  <section class="grid" id="grid"></section>
  <footer><span>KDX://MICROGRAPHICS/V1</span><span>CHECKSUM 8F21-A90C</span></footer>
</main>
<script>
const items = [
 ['kdx-dial-8','DIAL / 8','CONTROL','spin'],['kdx-compass','COMPASS','NAV','reverse'],['kdx-crosshair','CROSSHAIR','TARGET','pulse'],['kdx-sunburst','SUNBURST','SIGNAL','pulse'],['kdx-orbit','ORBIT','COSMOS','spin'],['kdx-radar','RADAR','SCAN','spin'],['kdx-node-ring','NODE RING','NETWORK','reverse'],['kdx-radial-fan','RADIAL FAN','ANALYSIS','drift'],['kdx-waveform','WAVEFORM','SIGNAL','pulse'],['kdx-equalizer','EQUALIZER','AUDIO','pulse'],['kdx-dot-matrix','DOT MATRIX','DATA','pulse'],['kdx-data-stack','DATA STACK','DATA','drift'],['kdx-bracket-frame','BRACKET FRAME','FRAME','pulse'],['kdx-hex-cluster','HEX CLUSTER','SYSTEM','drift'],['kdx-flower-cell','FLOWER CELL','BIO','pulse'],['kdx-infinity-node','INFINITY NODE','IDENTITY','pulse'],['kdx-scan-bar','SCAN BAR','STATUS','drift'],['kdx-signal-gate','SIGNAL GATE','PROTOCOL','pulse'],['kdx-checksum-grid','CHECKSUM GRID','VERIFY','pulse'],['kdx-ring-pulse','RING PULSE','SIGNAL','pulse'],['kdx-endpoint-graph','ENDPOINT GRAPH','NETWORK','drift'],['kdx-chevron-4','CHEVRON 4','NAV','pulse'],['kdx-portal','PORTAL','THRESHOLD','pulse']
];
const grid = document.querySelector('#grid');
items.forEach((item,i)=>{
 const [id,name,cat,motion] = item;
 const article = document.createElement('article');
 article.className='item'; article.dataset.code=String(i+1).padStart(2,'0');
 article.innerHTML=`<svg class="${motion}" viewBox="0 0 64 64" aria-hidden="true"><use href="../public/assets/kodex/kodex-micrographics.svg#${id}"></use></svg><div><strong>${name}</strong><small>${cat} / ACTIVE</small></div>`;
 grid.append(article);
});
</script>
</body>
</html>
