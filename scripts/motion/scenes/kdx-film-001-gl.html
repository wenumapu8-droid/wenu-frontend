<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KDX-FILM-001 · GL</title>
<style>
  @font-face { font-family:'Space Grotesk';
    src:url('/node_modules/@fontsource/space-grotesk/files/space-grotesk-latin-700-normal.woff2') format('woff2');
    font-weight:700; font-display:block; }
  html,body { margin:0; background:#000; overflow:hidden; }
  canvas { display:block; position:absolute; left:0; top:0; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>
<script type="module">
/* ── KDX-FILM-001 · versión GPU ─────────────────────────────────────────────
   Mismo contrato de plano, mismo guion y misma cámara que kdx-film-001.html.
   Cambia el motor: Canvas 2D → WebGL2. Existe para medir la diferencia.

   Lo que Canvas 2D no puede y esto sí:
   · 200 000 partículas con blending ADITIVO sobre un buffer en coma flotante.
     Donde se superponen, la luz se acumula por encima de 1.0 — es HDR real.
   · Bloom: lo que pasa de 1.0 se derrama. Tres escalas de desenfoque.
   · Tone mapping: el HDR se comprime a pantalla sin quemar a blanco plano.

   Por qué el bloom y no un gradiente radial: un gradiente dibuja un halo donde
   uno decide. El bloom lo produce la propia luz, donde la luz se concentra —
   las franjas de interferencia densas brillan solas. Esa es la diferencia que
   el ojo lee como "real".

   Tipografía en un canvas 2D aparte, encima: la biblia §8 pide componer el
   texto DESPUÉS del fenómeno, nunca dentro de él.
──────────────────────────────────────────────────────────────────────────── */
import {
  clamp, span, lerp, easeOutCubic, easeInOutCubic, easeOutExpo, easeOutQuint,
  waitForFonts, mulberry32, loadSvgCrop, tint, KODEX_WORDMARK, KODEX_WORDMARK_BOX,
} from '../scene-kit.js';

const W = 1080, H = 1920, DUR = 15;
const CX = 540, CY = 900;
const N = 200000;

const gl = document.getElementById('gl').getContext('webgl2',
  { antialias: false, preserveDrawingBuffer: true, premultipliedAlpha: false });
gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');
const ui = document.getElementById('ui').getContext('2d');

/* ── utilidades GL ──────────────────────────────────────────────────────── */
function sh(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s) + '\n' + src);
  return s;
}
function prog(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) { const a = gl.getActiveUniform(p, i); u[a.name] = gl.getUniformLocation(p, a.name); }
  return { p, u };
}
function target(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR],
                        [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]])
    gl.texParameteri(gl.TEXTURE_2D, k, v);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  return { tex, fb, w, h };
}

const QUAD_VS = `#version 300 es
in vec2 aP; out vec2 vUv;
void main(){ vUv = aP*0.5+0.5; gl_Position = vec4(aP,0.,1.); }`;

/* ── partículas: la interferencia vive en el vertex shader ──────────────── */
const P_VS = `#version 300 es
precision highp float;
in vec2 aBase; in float aSeed;
uniform float uT,uD,uK,uPhase,uReach,uAmp,uCondense,uZoom,uCamY;
uniform vec2 uRes;
out float vB;
void main(){
  vec2 p = aBase;
  float r = length(p);
  // dos fuentes puntuales: brillo = diferencia de camino
  float r1 = length(p - vec2(0., -uD));
  float r2 = length(p - vec2(0.,  uD));
  float v = cos((r1 - r2) * uK - uPhase);
  float b = pow((v + 1.) * .5, mix(1.6, 3.6, uCondense));
  b *= clamp(1. - r / uReach, 0., 1.) * clamp(r / 80., 0., 1.) * uAmp;
  // profundidad leve: bajo el dolly da paralaje, que es lo que da volumen
  float z = (aSeed - .5) * 160.;
  p += vec2(sin(uT*.7 + aSeed*40.), cos(uT*.6 + aSeed*31.)) * 1.4;
  float persp = 1. + z / 1400. * (uZoom - 1.);
  vec2 px = vec2(${CX}., ${CY}.) + (p - vec2(0., uCamY)) * uZoom * persp;
  vec2 clip = px / uRes * 2. - 1.; clip.y = -clip.y;
  gl_Position = vec4(clip, 0., 1.);
  gl_PointSize = mix(1.3, 3.2, b) * min(uZoom * persp, 6.);
  vB = b;
}`;
const P_FS = `#version 300 es
precision highp float;
in float vB; out vec4 o;
void main(){
  vec2 q = gl_PointCoord * 2. - 1.;
  float d = dot(q, q);
  if (d > 1.) discard;
  vec3 col = mix(vec3(.04,.80,1.), vec3(.82,.97,1.), smoothstep(.45, 1., vB));
  o = vec4(col * exp(-d * 3.2) * vB * 1.05, 1.);
}`;

/* ── luz analítica: eje, fuentes, iris, fogonazo — en coordenadas de mundo ─ */
const L_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform vec2 uRes;
uniform float uZoom,uCamY,uD,uAxis,uObserver,uStable,uOpens,uFlare,uIrisR,uT;
void main(){
  vec2 px = vec2(vUv.x, 1. - vUv.y) * uRes;
  vec2 w = (px - vec2(${CX}., ${CY}.)) / uZoom + vec2(0., uCamY);
  vec3 cy = vec3(.063, .914, 1.);
  vec3 c = vec3(0.);
  float along = clamp(1. - abs(w.y) / 950., 0., 1.);
  float ax = abs(w.x);
  c += cy * (exp(-ax*ax/1.6) * 1.6 + exp(-ax/16.) * .30) * along * uAxis * (.55 + .9*uObserver);
  for (int i = 0; i < 2; i++) {
    float d = length(w - vec2(0., i == 0 ? -uD : uD));
    c += vec3(.92,.99,1.) * exp(-d*d/190.) * 3.2 * uAxis;
    c += cy * exp(-d/48.) * .75 * uAxis;
  }
  if (uObserver > .001) {
    float r = length(w);
    float ring  = exp(-pow((r - uIrisR) / 1.5, 2.));
    float pupil = exp(-pow((r - uIrisR * mix(.42, .26, uStable)) / 1.1, 2.)) * (1. - uOpens*.8);
    c += vec3(.72,.94,1.) * (ring * 1.6 + pupil) * uObserver;
  }
  float rr = length(px - vec2(${CX}., ${CY}.));
  c += vec3(.95,.99,1.) * exp(-rr / mix(60., 900., uOpens)) * uFlare * 2.6;
  c += cy * exp(-rr / mix(220., 1500., uOpens)) * uFlare * .9;
  o = vec4(c, 1.);
}`;

/* ── bloom ──────────────────────────────────────────────────────────────── */
const BRIGHT_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o; uniform sampler2D uTex;
void main(){ vec3 c = texture(uTex, vUv).rgb; o = vec4(max(c - .55, 0.), 1.); }`;
const BLUR_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o; uniform sampler2D uTex; uniform vec2 uDir;
void main(){
  float w[5] = float[](.227027, .1945946, .1216216, .054054, .016216);
  vec3 c = texture(uTex, vUv).rgb * w[0];
  for (int i = 1; i < 5; i++) {
    c += texture(uTex, vUv + uDir * float(i)).rgb * w[i];
    c += texture(uTex, vUv - uDir * float(i)).rgb * w[i];
  }
  o = vec4(c, 1.);
}`;

/* ── compuesto final: bloom + tone mapping + óptica ─────────────────────── */
const FINAL_FS = `#version 300 es
precision highp float;
in vec2 vUv; out vec4 o;
uniform sampler2D uHdr, uB1, uB2, uB3; uniform float uT;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14), 0., 1.); }
float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233)) + uT*61.7) * 43758.5453); }
void main(){
  // aberración cromática ÓPTICA, mínima y radial: es lente, no glitch (§14)
  vec2 d = (vUv - .5) * .0024;
  vec3 hdr = vec3(texture(uHdr, vUv + d).r, texture(uHdr, vUv).g, texture(uHdr, vUv - d).b);
  vec3 bloom = texture(uB1, vUv).rgb * .55 + texture(uB2, vUv).rgb * .75 + texture(uB3, vUv).rgb * .95;
  vec3 c = aces((hdr + bloom) * 1.15);
  float vig = smoothstep(1.15, .35, length((vUv - .5) * vec2(1., 1.6)));
  c *= mix(.55, 1., vig);
  c = pow(c, vec3(1. / 2.2));
  // El grano va DESPUÉS de la gamma. Sumado en lineal, un ruido de 0.017 se
  // vuelve 0.16 tras pow(1/2.2) y los negros quedan grises.
  c += (hash(vUv * vec2(1080., 1920.)) - .5) * .022;
  o = vec4(c, 1.);
}`;

/* ── recursos ───────────────────────────────────────────────────────────── */
let progP, progL, progBright, progBlur, progFinal;
let quad, pVao, hdr, b1a, b1b, b2a, b2b, b3a, b3b;

function setup() {
  progP = prog(P_VS, P_FS);
  progL = prog(QUAD_VS, L_FS);
  progBright = prog(QUAD_VS, BRIGHT_FS);
  progBlur = prog(QUAD_VS, BLUR_FS);
  progFinal = prog(QUAD_VS, FINAL_FS);

  quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

  // Partículas: 75% disco uniforme, 25% banda sobre el eje — como el gate
  const rnd = mulberry32(20261016);
  const data = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    let x, y;
    if (i < N * 0.75) {
      const a = rnd() * Math.PI * 2, r = 900 * Math.sqrt(rnd());
      x = Math.cos(a) * r; y = Math.sin(a) * r;
    } else {
      const g = Math.sqrt(-2 * Math.log(rnd() + 1e-9)) * Math.cos(2 * Math.PI * rnd());
      x = g * 34; y = (rnd() * 2 - 1) * 900;
    }
    data[i*3] = x; data[i*3+1] = y; data[i*3+2] = rnd();
  }
  pVao = gl.createVertexArray();
  gl.bindVertexArray(pVao);
  const pb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, pb);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  const la = gl.getAttribLocation(progP.p, 'aBase'), ls = gl.getAttribLocation(progP.p, 'aSeed');
  gl.enableVertexAttribArray(la); gl.vertexAttribPointer(la, 2, gl.FLOAT, false, 12, 0);
  gl.enableVertexAttribArray(ls); gl.vertexAttribPointer(ls, 1, gl.FLOAT, false, 12, 8);
  gl.bindVertexArray(null);

  hdr = target(W, H);
  b1a = target(W/2, H/2); b1b = target(W/2, H/2);
  b2a = target(W/4, H/4); b2b = target(W/4, H/4);
  b3a = target(W/8, H/8); b3b = target(W/8, H/8);
}

function drawQuad(p) {
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  const l = gl.getAttribLocation(p.p, 'aP');
  gl.enableVertexAttribArray(l);
  gl.vertexAttribPointer(l, 2, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
function pass(p, dst, bind) {
  gl.bindFramebuffer(gl.FRAMEBUFFER, dst ? dst.fb : null);
  gl.viewport(0, 0, dst ? dst.w : W, dst ? dst.h : H);
  gl.useProgram(p.p);
  bind(p.u);
  drawQuad(p);
}
function tex(unit, t, loc) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t.tex); gl.uniform1i(loc, unit); }
function blur(src, tmp, scale) {
  pass(progBlur, tmp, (u) => { tex(0, src, u.uTex); gl.uniform2f(u.uDir, scale / src.w, 0); });
  pass(progBlur, src, (u) => { tex(0, tmp, u.uTex); gl.uniform2f(u.uDir, 0, scale / src.h); });
}

/* ── tipografía ─────────────────────────────────────────────────────────── */
const MARK = tint(await loadSvgCrop(KODEX_WORDMARK, KODEX_WORDMARK_BOX, 790), '#ffffff');
const SCRIPT = [
  ['SIGNAL LATENT',            1.10,  3.60],
  ['MEMORY HOST DETECTED',     3.90,  6.20],
  ['PATTERN WANTS A WITNESS',  6.50,  8.80],
  ['EYE CONTACT REGISTERED',   9.00, 10.90],
  ['ACCESS THROUGH ATTENTION',11.10, 12.60],
];
function label(s, x, y, a, color, size, track, align = 'center') {
  if (a <= 0.01) return;
  ui.save();
  ui.globalAlpha = a; ui.fillStyle = color;
  ui.font = `700 ${size}px "Space Grotesk", sans-serif`;
  ui.letterSpacing = track; ui.textAlign = align;
  ui.fillText(s, x, y);
  ui.restore();
}

/* ── frame ──────────────────────────────────────────────────────────────── */
function render(t) {
  const detect   = easeOutCubic(span(t,  1.60,  4.40));
  const condense = easeInOutCubic(span(t, 4.40,  8.20));
  const observer = easeInOutCubic(span(t, 8.20, 10.80));
  const stable   = easeInOutCubic(span(t,10.80, 12.60));
  const opens    = easeOutQuint(span(t, 12.60, 14.10));
  const worldA   = 1 - easeOutCubic(span(t, 13.70, 14.40));
  const flare    = opens * (1 - easeOutCubic(span(t, 13.70, 14.55)));

  const zoom = lerp(1.0, 1.34, easeInOutCubic(span(t, 0.6, 12.6))) * lerp(1, 5.2, Math.pow(opens, 2.3));
  const camY = lerp(40, 0, easeOutCubic(span(t, 0.6, 9.0)));
  const d = lerp(300, 86, condense);
  const irisR = lerp(230, 198, stable) * lerp(1, 7.5, Math.pow(opens, 1.7))
              * (1 + 0.018 * Math.sin(t * 1.5 * Math.PI) * (1 - opens));

  // 1 · escena HDR: partículas aditivas + luz analítica
  gl.bindFramebuffer(gl.FRAMEBUFFER, hdr.fb);
  gl.viewport(0, 0, W, H);
  gl.clearColor(0.0006, 0.0012, 0.0035, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);

  if (worldA > 0.01) {
    gl.useProgram(progP.p);
    const u = progP.u;
    gl.uniform2f(u.uRes, W, H);
    gl.uniform1f(u.uT, t); gl.uniform1f(u.uD, d);
    gl.uniform1f(u.uK, lerp(0.052, 0.030, condense));
    gl.uniform1f(u.uPhase, t * 2.35);
    gl.uniform1f(u.uReach, lerp(130, 880, detect) * lerp(1, 0.78, stable));
    gl.uniform1f(u.uAmp, (0.18 + 0.82 * detect) * worldA);
    gl.uniform1f(u.uCondense, condense);
    gl.uniform1f(u.uZoom, zoom); gl.uniform1f(u.uCamY, camY);
    gl.bindVertexArray(pVao);
    gl.drawArrays(gl.POINTS, 0, N);
    gl.bindVertexArray(null);

    gl.useProgram(progL.p);
    const l = progL.u;
    gl.uniform2f(l.uRes, W, H);
    gl.uniform1f(l.uZoom, zoom); gl.uniform1f(l.uCamY, camY); gl.uniform1f(l.uD, d);
    gl.uniform1f(l.uAxis, easeOutCubic(span(t, 2.0, 5.0)) * worldA);
    gl.uniform1f(l.uObserver, observer * worldA); gl.uniform1f(l.uStable, stable);
    gl.uniform1f(l.uOpens, opens); gl.uniform1f(l.uFlare, 0); gl.uniform1f(l.uIrisR, irisR);
    gl.uniform1f(l.uT, t);
    drawQuad(progL);
  }
  if (flare > 0.001) {
    gl.useProgram(progL.p);
    const l = progL.u;
    gl.uniform1f(l.uAxis, 0); gl.uniform1f(l.uObserver, 0);
    gl.uniform1f(l.uFlare, flare); gl.uniform1f(l.uOpens, opens);
    drawQuad(progL);
  }
  gl.disable(gl.BLEND);

  // 2 · bloom en tres escalas
  pass(progBright, b1a, (u) => tex(0, hdr, u.uTex));
  blur(b1a, b1b, 1.0);
  pass(progBright, b2a, (u) => tex(0, b1a, u.uTex));
  blur(b2a, b2b, 1.4);
  pass(progBright, b3a, (u) => tex(0, b2a, u.uTex));
  blur(b3a, b3b, 1.8);

  // 3 · compuesto a pantalla
  pass(progFinal, null, (u) => {
    tex(0, hdr, u.uHdr); tex(1, b1a, u.uB1); tex(2, b2a, u.uB2); tex(3, b3a, u.uB3);
    gl.uniform1f(u.uT, t);
  });

  // 4 · tipografía, encima y aparte (§8)
  ui.clearRect(0, 0, W, H);
  const slate = easeOutCubic(span(t, 0.5, 1.4)) * (1 - easeOutCubic(span(t, 12.4, 12.9)));
  label('KDX-FILM-001', 60, 206, 0.6 * slate, '#10E9FF', 19, '7px', 'left');
  label('SIGNAL / THRESHOLD', 60, 236, 0.34 * slate, '#2A5865', 16, '6px', 'left');
  for (const [line, from, to] of SCRIPT) {
    const a = easeOutCubic(span(t, from, from + 0.5)) * (1 - easeOutCubic(span(t, to, to + 0.45)));
    label(line, CX, 1548, 0.92 * a, '#CFF4FC', 25, '12px');
  }
  const w = easeOutExpo(span(t, 14.05, 14.60));
  if (w > 0) {
    ui.save(); ui.globalAlpha = w;
    ui.drawImage(MARK, (W - MARK.width) / 2, CY - MARK.height / 2);
    ui.restore();
    label('LIVING ARCHIVE OF SIGNAL', CX, CY + MARK.height / 2 + 44,
          0.85 * easeOutCubic(span(t, 14.35, 14.85)), '#9FD4E8', 21, '11px');
  }
}

/* ── montaje: misma interfaz que espera el renderer ─────────────────────── */
window.SCENE = { duration: DUR, fps: 30, width: W, height: H };
window.resizeScene = (w, h) => {
  for (const id of ['gl', 'ui']) {
    const c = document.getElementById(id);
    c.width = W; c.height = H; c.style.width = w + 'px'; c.style.height = h + 'px';
  }
};
window.resizeScene(W, H);
setup();
await waitForFonts(['700 25px "Space Grotesk"', '700 19px "Space Grotesk"']);
window.renderFrame = (t) => { render(t); gl.finish(); };
render(0);
</script>
</body>
</html>
